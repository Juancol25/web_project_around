<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Juan Diego Pardo" />
    <meta
      name="description"
      content="Proyecto Alrededor de los EE.UU. del Sprint 7"
    />
    <meta name="keywords" content="around, viajes, aventura" />
    <title>Alrededor de los EE.UU.</title>

    <link rel="stylesheet" href="./pages/index.css" />
  </head>

  <body>
    <div class="page">
      <header class="header">
        <img
          class="header__logo"
          src="./images/Vector.svg"
          alt="Around The U.S."
        />
        <div class="header__line"></div>
      </header>

      <main class="main">
        <section class="profile" aria-label="Perfil del usuario">
          <div class="profile__avatar">
            <img
              class="profile__img"
              src="./images/Avatar.png"
              alt="Retrato de Jacques Cousteau"
            />
          </div>

          <div class="profile__info">
            <h1 class="profile__info_name">Jacques Cousteau</h1>
            <button
              class="profile__info_edit"
              type="button"
              aria-label="Editar perfil"
            ></button>
            <p class="profile__info_ocupation">Explorer Extraordinary</p>
          </div>

          <button
            class="profile__add-button"
            type="button"
            aria-label="Agregar tarjeta"
          >
            <img
              class="profile__add-button-image"
              src="./images/Vector (1).svg"
              alt=""
            />
          </button>
        </section>

        <ul class="elements"></ul>
      </main>

      <footer class="footer">
        <p class="footer__text"> 2024 Around The U.S.</p>
      </footer>

      <div class="popup popup_type_profile">
        <div class="popup__container">
          <button
            class="popup__close"
            type="button"
            aria-label="Cerrar ventana"
          ></button>
          <form class="popup__form" novalidate>
            <h2 class="popup__form_title">Editar perfil</h2>
            <label class="popup__form-label">
              <input
                class="popup__input popup__input_name"
                type="text"
                name="name"
                placeholder="Nombre"
                required
                minlength="2"
                maxlength="40"
              />
              <span id="error-name" class="popup__error"></span>
            </label>
            <label class="popup__form-label">
              <input
                class="popup__input popup__input_ocupation"
                type="text"
                name="about"
                placeholder="Acerca de mi"
                minlength="2"
                maxlength="200"
                required
              />
              <span id="error-about" class="popup__error"></span>
            </label>
            <button class="popup__button popup__button_profile" type="submit">
              Guardar
            </button>
          </form>
        </div>
      </div>
    </div>

    <template id="placetemplate">
      <li class="element">
        <img class="element__image" alt="" />
        <div class="element__white">
          <h2 class="element__white_title"></h2>
          <button
            class="element__white_button"
            type="button"
            aria-label="Me gusta"
          ></button>
        </div>
      </li>
    </template>

    <script src="./scripts/index.js" type="module"></script>
  </body>
</html>
